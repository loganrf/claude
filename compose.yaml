# Claude Code sandbox as an always-on service you can reach from
# https://claude.ai/code and the Claude app (Remote Control), with a web UI to
# set it up.
#
#   cp .env.example .env              # optional: web UI password, tokens, git identity, repo to clone
#   mkdir -p workspace
#   docker compose up -d
#   docker compose logs claude        # the setup code for your first visit
#
# Then open http://localhost:8765 (or this machine's address): create a
# password, sign in to Claude and add a GitHub token. Remote Control starts as
# soon as you're signed in. Prefer the terminal for signing in?
#   docker compose run --rm claude login
#
# Open Claude Code in the terminal at any time:
#   docker compose exec claude claude
#
# For a Team/Enterprise self-hosted environment use compose.runner.yaml instead.
name: claude-sandbox

services:
  claude:
    image: ${CLAUDE_SANDBOX_IMAGE:-ghcr.io/loganrf/claude:latest}
    command: ["server"]
    # Default Remote Control session names start with the hostname.
    hostname: ${CLAUDE_SANDBOX_HOSTNAME:-claude-sandbox}
    env_file:
      - path: .env
        required: false
    ports:
      # Web UI. CLAUDE_SANDBOX_WEBUI_PORT=127.0.0.1:8765 in .env accepts
      # connections from this machine only.
      - "${CLAUDE_SANDBOX_WEBUI_PORT:-8765}:8765"
    volumes:
      # Claude Code login, settings and history, and what you save in the web
      # UI. Keep it: it holds your login.
      - claude-config:/home/claude/.claude
      # The project Claude works on. Point WORKSPACE at an existing checkout,
      # or leave it and set GIT_REPO_URL to clone into it on first start.
      - ${WORKSPACE:-./workspace}:/workspace
    # A TTY lets you `docker attach claude-sandbox-claude-1` to watch the
    # Remote Control status screen (detach with Ctrl-P Ctrl-Q).
    tty: true
    stdin_open: true
    # Time for Remote Control to close its sessions on `docker compose down`.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  claude-config:
